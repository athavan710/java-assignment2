<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cubicsolver</title>
</head>

<body>
  <div class="input-container">
    <h1>Cubic Solver</h1>
    <form id="cubicsolver">
      <div class="inputs">
        <label for="a">a value:</label>
        <input type="number" id="a" name="a" placeholder="a value" required />
        <label for="b">b value:</label>
        <input type="number" id="b" name="b" placeholder="b value" required />
        <label for="c">c value:</label>
        <input type="number" id="c" name="c" placeholder="c value" required />
        <label for="d">d value:</label>
        <input type="number" id="d" name="d" placeholder="d value" required />
        <button type="submit">Solve Cubic</button>
      </div>
    </form>
    <div id="equation">
      <div id="showequation"
        style="margin-top: 20px; min-height: 1.5em; font-size: 1.2rem; font-weight: bold; color: #4f46e5;">
      </div>
    </div>
  </div>




  <div class="results-table">
    <table>
      <tr>
        <td>p</td>
        <td id="p">0</td>
      </tr>
      <tr>
        <td>q</td>
        <td id="q">0</td>
      </tr>
      <tr>
        <td>Discriminant</td>
        <td id="discriminant">0</td>
      </tr>
      <tr>
        <th>Value</th>
        <th>x</th>
        <th>y</th>
      </tr>
      <tr>
        <td>Root 1</td>
        <td id="root1">0</td>
        <td>0</td>
      </tr>
      <tr>
        <td>Root 2</td>
        <td id="root2">0</td>
        <td>0</td>
      </tr>
      <tr>
        <td>Root 3</td>
        <td id="root3">0</td>
        <td>0</td>
      </tr>
    </table>
  </div>
  </form>

  <canvas id="graph" width="600" height="400"></canvas>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
